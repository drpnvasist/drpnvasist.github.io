<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A short story game about getting found, delivering, and keeping customers. Three situations, your choices, and what they lead to.">
<meta name="theme-color" content="#0b41c2">
<meta property="og:type" content="website">
<meta property="og:title" content="Keep the Customer">
<meta property="og:description" content="A short story game about getting found, delivering, and keeping customers.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b41c2'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23fc4109'/%3E%3C/svg%3E">
<title>Keep the Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
/* Layout idea: a one-screen game. Each stage is a flat colour wall with a floor band along the bottom; the things you
   pick stand on that floor. Content is sized to fit the viewport (scaled down if it must), never scrolled. */
:root{
  --ink:#201e1f; --paper:#f4efe8; --accent:#fc4109;
  --pink:#ffabc8; --purple:#e7bfff; --lilac:#cb9cf8; --blue:#5d9dc5; --mint:#69b488; --sage:#b0be77;
  --yellow:#f8d867; --cobalt:#0b41c2; --tomato:#e83729; --bottle:#1c3d24;
  --card:#f3ead8; --card-red:#d8402c;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Cutive Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(16px,2.4vw,40px);
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.3,1.5,.5,1);
  --bg:#0b41c2; --fg:#f4efe8; --floor:#d1c2af;
  --floor-h:clamp(72px,10vh,96px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);font-weight:300;font-size:17px;line-height:1.3;
  font-variation-settings:"opsz" 24;font-synthesis:none;-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background-color .6s var(--ease),color .6s var(--ease)}
::selection{background:var(--accent);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-variation-settings:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
em,.em{font-style:normal;font-weight:800;letter-spacing:-.01em}
.acc{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell: top bar + fitted content; floor band is fixed to the bottom */
#shell{position:relative;z-index:2;height:100%;max-width:1240px;margin:0 auto;padding-bottom:var(--floor-h);transition:padding-bottom .6s var(--ease)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.meter,.opt,.col,.story{min-width:0}
.main{min-height:0;overflow:hidden}
.fit{transform-origin:0 0;padding:12px 8px 8px}
.floor{position:fixed;left:0;right:0;bottom:0;height:var(--floor-h);background:var(--floor);z-index:1;transition:height .6s var(--ease),background-color .6s var(--ease)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(32,30,31,.25)}
.stand{position:absolute;right:max(var(--pad),env(safe-area-inset-right,0px));bottom:30px;display:flex;gap:18px;align-items:flex-end;pointer-events:none}
.sit{position:relative;width:clamp(40px,6.4vh,56px);height:clamp(40px,6.4vh,56px);animation:popin .8s var(--spring) both}
.sit svg{width:100%;height:100%;display:block}
.sit i{position:absolute;left:8%;right:8%;bottom:-6px;height:8px;border-radius:50%;background:#2a2620;opacity:.3;filter:blur(5px)}
.sit.out{animation:popout .3s var(--ease) both}
@keyframes popin{from{transform:translateY(-30px) scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes popout{to{transform:scale(.5);opacity:0}}
.floor-art{position:absolute;right:max(var(--pad),3vw);bottom:calc(30% + 14px);width:min(44vw,540px);opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .9s var(--ease);pointer-events:none}
.floor-art svg{display:block;width:100%;height:auto;overflow:visible}
.intro{--floor-h:clamp(100px,24vh,220px)}
.intro .floor-art{opacity:1;transform:none}
.crate-bob{transform-origin:50% 100%;animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,to{transform:scale(1)}50%{transform:scale(1.035)}}

/* top bar */
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 8px 0;flex-wrap:nowrap}
.pill{display:inline-flex;align-items:center;gap:.6em;height:40px;padding:0 16px;border:1px solid transparent;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;transition:background-color .3s,color .3s,transform .5s var(--ease)}
.pill:hover{transform:translateY(-1px)}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pill .md{font-family:var(--f-mono);font-weight:400;color:var(--accent)}
.pill.brand{border-color:currentColor}
.pill.pink{background:var(--pink);color:var(--ink)}
.pill.ghost{border-color:currentColor}
.pill.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
a.pill{text-decoration:none;color:inherit}
@media (max-width:400px){.acts{gap:6px}.pill{padding:0 10px}}
.acts{display:flex;gap:8px}
.steps{display:flex;gap:6px;list-style:none;min-width:0}
.steps li{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:999px;font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;transition:background-color .5s var(--ease),color .5s var(--ease)}
.steps .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid currentColor;font-size:12px}
.steps .t{padding-right:8px}
.steps li.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps li.now{background:var(--paper);color:var(--ink);border-color:var(--ink)}
.steps li.now .n{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:1060px){.steps li:not(.now) .t{display:none}.steps li:not(.now){padding-right:6px}}
@media (max-width:560px){.pill.brand .full{display:none}.pill{height:36px;padding:0 12px;font-size:13px}}

/* type */
h1{font-weight:800;font-size:clamp(46px,min(10vw,13.5vh),150px);letter-spacing:-.045em;line-height:.88;font-variation-settings:"opsz" 96}
h2{font-weight:700;letter-spacing:-.035em;line-height:1}
.ask{font-size:clamp(26px,min(3.6vw,5.6vh),52px);max-width:22ch}
.lead{font-size:clamp(18px,min(2vw,3.4vh),28px);letter-spacing:-.018em;line-height:1.14;max-width:36ch}
.hint{font-family:var(--f-mono);font-size:clamp(12px,1.1vw,15px);letter-spacing:.04em;opacity:.85;max-width:62ch}
.ln-mask{display:block;clip-path:inset(-.14em 0 -.16em);margin:-.22em -.12em 0;padding:.22em .12em 0}
.ln{display:block;animation:lineUp .9s var(--ease) backwards}
@keyframes lineUp{from{transform:translateY(112%)}to{transform:none}}
.stage>*{animation:rise .7s var(--ease) backwards}
.stage>*:nth-child(2){animation-delay:.05s}.stage>*:nth-child(3){animation-delay:.1s}.stage>*:nth-child(4){animation-delay:.15s}.stage>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;height:48px;padding:0 26px;border-radius:999px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font-weight:700;font-size:16px;letter-spacing:-.01em;transition:background-color .3s,color .3s,transform .5s var(--ease),opacity .3s}
.btn:hover:not(:disabled){background:var(--paper);color:var(--ink);transform:translateY(-2px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px}
.preview{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;max-width:50ch;opacity:0;transition:opacity .3s;margin:0}
.preview.on{opacity:.9}

/* layout grids */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(18px,3vw,44px);align-items:end}
.col{display:grid;gap:12px;align-content:end}
.col.top{align-content:start}

/* meters */
.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;position:relative}
.meter{position:relative;background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px 11px;cursor:help}
.meter:hover,.meter:focus{outline:none;box-shadow:0 0 0 2px var(--ink)}
.meter:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.meter b{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;letter-spacing:-.01em;margin-bottom:6px}
.meter b svg{width:17px;height:17px;flex:none}
.info{margin-left:auto;font-weight:700;font-size:11px;width:17px;height:17px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center}
.delta{font-size:11px;min-width:10px}.delta.up{color:var(--bottle)}.delta.down{color:var(--tomato)}
.track{height:8px;border-radius:99px;background:rgba(32,30,31,.14);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .9s var(--ease)}
.track.cash i{background:var(--accent)}
.status{display:block;margin-top:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{position:relative;z-index:5}
.meters{z-index:30}
.meter:hover,.meter:focus{z-index:31}
.tip{display:none;position:absolute;z-index:40;left:0;top:calc(100% + 8px);width:240px;max-width:80vw;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:0;line-height:1.35;padding:11px 15px;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.meter:hover .tip,.meter:focus .tip{display:block}
.meters .meter:nth-child(even) .tip{left:auto;right:0}
.meters .meter:nth-child(n+3) .tip{top:auto;bottom:calc(100% + 8px)}

/* speech bubble */
.story{position:relative;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:24px;padding:14px 20px 16px;font-weight:400;font-size:clamp(15px,min(1.45vw,2.5vh),20px);line-height:1.3;letter-spacing:-.005em}
.story p{margin:0 0 .45em}.story p:last-child{margin:0}
.story small{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--accent);margin-bottom:.5em}
.story small::before{content:"## "}
.story b{font-weight:700;letter-spacing:-.01em}
.story::after{content:"";position:absolute;bottom:-10px;left:30px;width:18px;height:18px;background:var(--paper);border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:rotate(45deg) skew(12deg,12deg)}
.shows{font-size:clamp(18px,min(2vw,3.4vh),28px);letter-spacing:-.018em;line-height:1.12;max-width:40ch}
.shows small{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;margin-bottom:4px}
.shows small::before{content:"## ";color:var(--accent)}
.shows span{font-weight:800}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 16px;padding-top:12px;margin-top:6px}
.opts.dense{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);color:var(--ink);border-radius:12px;padding:7px 7px 12px;transform:rotate(var(--a,0deg));transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.opt::before{content:"";position:absolute;left:50%;top:-10px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent);transform:rotate(calc(-1*var(--a,0deg)));opacity:0;transition:opacity .3s}
.opt[aria-pressed="true"]::before{opacity:1}
button.opt:hover:not(:disabled),button.opt:focus-visible{transform:translateY(-6px) scale(1.02) rotate(0);box-shadow:0 8px 16px rgba(70,40,0,.28)}
.opt[aria-pressed="true"]{transform:translateY(-4px) rotate(0);box-shadow:0 8px 16px rgba(70,40,0,.28),0 0 0 2px var(--ink)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.window{display:grid;place-items:center;position:relative;height:clamp(52px,9vh,84px);background:var(--room,var(--blue));overflow:hidden}
.window::after{content:"";position:absolute;inset:0;border:1.5px solid var(--card-red);pointer-events:none}
.window svg{width:clamp(42px,7vh,64px);height:clamp(42px,7vh,64px);position:relative;z-index:1;transition:transform .5s var(--ease)}
button.opt:hover:not(:disabled) .window svg{transform:scale(1.1) rotate(-3deg)}
.ttl{display:block;font-weight:700;font-size:15px;letter-spacing:-.015em;line-height:1.1;padding:2px 30px 0 4px}
.dsc{display:block;font-size:13px;line-height:1.25;padding:0 4px}
.tags{display:grid;gap:2px;margin:2px 4px 0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.01em;line-height:1.25}
.tags b{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin-right:4px}
.tick{position:absolute;right:12px;top:calc(clamp(52px,9vh,84px) + 14px);width:24px;height:24px;border-radius:50%;border:1px solid var(--ink);background:var(--card);display:grid;place-items:center;font-weight:700;font-size:12px;line-height:1;color:var(--paper);transition:background-color .3s}
.opt[aria-pressed="true"] .tick{background:var(--ink)}
.nope{display:none;margin:0 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;color:var(--tomato)}
.opt:disabled .nope{display:block}
/* dense = stage 3, horizontal cards */
.dense .opt{display:grid;grid-template-columns:clamp(56px,8vh,72px) 1fr;gap:2px 10px;padding:7px;align-items:start}
.dense .window{grid-row:1/span 4;height:100%;min-height:clamp(56px,8vh,72px)}
.dense .window svg{width:44px;height:44px}
.dense .tick{top:8px;right:8px}
.dense .ttl{font-size:14px;padding:0 28px 0 0}
.dense .dsc{padding:0;font-size:12.5px}
.dense .tags{margin:2px 0 0;font-size:11px}
.dense .nope{margin:0}
.ins{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px 6px 6px}
.ins .window{height:44px}.ins .window svg{width:32px;height:32px}
.ins .q{display:block;font-weight:700;font-size:15px;line-height:1.1;letter-spacing:-.01em}
.ins p{font-size:12px;line-height:1.25;margin-top:2px}

/* outcome */
.stamp{display:inline-block;justify-self:start;background:var(--paper);color:var(--ink);border-radius:999px;padding:.02em .5em .1em;font-weight:800;font-size:clamp(26px,min(3.6vw,6vh),54px);line-height:1.1;letter-spacing:-.04em;transform:rotate(-2deg);animation:stamp .6s var(--ease) both}
@keyframes stamp{from{transform:scale(1.7) rotate(-8deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
.recap{display:grid;gap:8px}
.recap div{display:grid;grid-template-columns:128px 1fr;gap:12px;padding:9px 14px;background:var(--card);color:var(--ink);border-radius:12px;align-items:baseline}
.recap b{font-family:var(--f-mono);font-weight:400;font-size:12px;letter-spacing:.1em}
.recap span{font-size:14.5px;font-weight:400;line-height:1.2}
.lesson{--rule:27px;--margin:44px;padding:var(--rule) 18px var(--rule) calc(var(--margin) + 14px);border-radius:6px;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent var(--margin),color-mix(in srgb,var(--accent) 55%,transparent) var(--margin),color-mix(in srgb,var(--accent) 55%,transparent) calc(var(--margin) + 1px),transparent calc(var(--margin) + 1px)),
  repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--rule) - 1px),color-mix(in srgb,var(--blue) 45%,transparent) calc(var(--rule) - 1px),color-mix(in srgb,var(--blue) 45%,transparent) var(--rule));
  line-height:var(--rule);font-size:14.5px}
.lesson h3{font-size:18px;line-height:var(--rule);font-weight:700;letter-spacing:-.025em}
.lesson h3::before{content:"## ";font-family:var(--f-mono);font-weight:400;color:var(--accent)}
.lesson ul{list-style:none}.lesson li::before{content:"- ";font-family:var(--f-mono)}
.note{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.03em;opacity:.85;max-width:70ch}

/* intro */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:clamp(14px,3vh,30px);max-width:760px}
.how div{position:relative;background:var(--card);color:var(--ink);border-radius:12px;padding:14px 14px 16px;font-size:13.5px;line-height:1.25;transform:rotate(var(--a,0deg));transition:transform .5s var(--ease)}
.how div:hover{transform:translateY(-6px) scale(1.03) rotate(0)}
.how b{display:block;font-weight:700;font-size:16px;letter-spacing:-.015em;margin-bottom:4px}
.how div::before{content:"";position:absolute;left:50%;top:-9px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent)}
.intro-copy{max-width:760px}
.intro-copy .lead{margin-top:clamp(12px,2.4vh,24px)}

/* how to play */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(16,14,15,.62);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 14px 16px;overflow:auto}
.dlg{position:relative;background:var(--paper);color:var(--ink);border-radius:28px;width:min(980px,100%);max-height:100%;overflow:auto;padding:clamp(22px,3.2vw,42px);display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(20px,3vw,44px);animation:rise .6s var(--ease) both}
.dlg .x{position:absolute;right:16px;top:16px;background:var(--paper);height:34px;font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.12em;margin-bottom:10px}
.eyebrow::before{content:"## ";color:var(--accent)}
.dlg h2{font-size:clamp(34px,5vw,64px);line-height:.95}
.dlg .lead2{font-size:clamp(17px,1.7vw,22px);line-height:1.18;letter-spacing:-.012em;margin-top:12px;max-width:34ch}
.dsteps{list-style:none;margin-top:18px;display:grid;gap:10px;counter-reset:s}
.dsteps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:baseline;font-size:15px;line-height:1.25;counter-increment:s}
.dsteps li::before{content:counter(s);font-weight:800;font-size:24px;line-height:.9;letter-spacing:-.03em;color:var(--card-red)}
.dsteps b{font-weight:700;letter-spacing:-.01em}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px;padding-top:6px}
.mcard{position:relative;background:var(--card);border-radius:12px;padding:6px 6px 12px;box-shadow:0 4px 10px rgba(70,40,0,.16);transform:rotate(var(--a,0deg))}
.mcard::before{content:"";position:absolute;left:50%;top:-8px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:var(--accent)}
.mcard .window{height:54px}
.mcard .window svg{width:30px;height:30px}
.mcard b{display:block;margin:8px 4px 2px;font-weight:700;font-size:15px;letter-spacing:-.015em}
.mcard p{margin:0 4px;font-size:12.5px;line-height:1.25}
.dr .btn{margin-top:18px}
.dr .note{margin-top:12px}
@media (max-width:759px){.dlg{grid-template-columns:minmax(0,1fr)}}

/* responsive: stack, compact, swipe options */
@media (max-width:1000px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.dense{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:759px){
  .tbar{flex-wrap:wrap;row-gap:8px}
  .steps{order:3;width:100%;justify-content:center}
  .split{grid-template-columns:minmax(0,1fr);align-items:start;gap:12px}
  .meters{grid-template-columns:repeat(4,1fr);gap:6px}
  .meter{padding:7px 8px 9px}.meter b{font-size:11px;gap:4px;margin-bottom:5px}.meter b svg{width:14px;height:14px}.info{display:none}
  .status{font-size:10px;margin-top:4px}
  .meters .meter:nth-child(odd) .tip{left:0;right:auto}.meters .meter:nth-child(even) .tip{left:auto;right:0}

.disc{position:fixed;left:0;right:0;bottom:calc(7px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;justify-content:center;padding:0 max(var(--pad),env(safe-area-inset-left,0px));pointer-events:none}
.disc p{margin:0;max-width:1000px;text-align:center;background:rgba(244,239,232,.95);color:var(--ink);border-radius:16px;padding:5px 16px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em;line-height:1.35;pointer-events:auto}

.wall{position:fixed;inset:0;z-index:1;pointer-events:none}
.frame{--fw:clamp(150px,15vw,210px);display:none;position:absolute;width:var(--fw);margin:0;background:var(--card);border-radius:12px;padding:7px 7px 9px;box-shadow:0 8px 16px rgba(70,40,0,.28);transform:rotate(var(--a,0deg));animation:popin .9s var(--spring) backwards;animation-delay:var(--d,0s)}
.frame::before{content:"";position:absolute;left:50%;top:-8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent)}
.frame .pic{position:relative;aspect-ratio:4/3;background:var(--room,var(--blue));overflow:hidden}
.frame .pic::after{content:"";position:absolute;inset:0;border:1.5px solid var(--card-red)}
.frame svg{display:block;width:100%;height:100%}
.frame svg text{font-family:var(--f-display);font-weight:800}
.frame figcaption{margin:7px 3px 0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;line-height:1.2;color:var(--ink)}
/* intro: a pinned cluster on the empty top right of the wall */
@media (min-width:1100px) and (min-height:640px){
  html[data-screen="intro"] .frame{display:block}
  html[data-screen="intro"] .frame:nth-child(1){right:calc(max(var(--pad),(100vw - 1240px)/2) + clamp(170px,17vw,250px));top:clamp(96px,16vh,150px);--a:-4deg}

}

function bar(label){
  const cur=stageNo();
  const steps=JOURNEY.map((t,i)=>{const no=i+1,cls=no<cur?'done':(no===cur?'now':'');
    return `<li class="${cls}" ${no===cur?'aria-current="step"':''}><span class="n">${no<cur?'&#10003;':no}</span><span class="t">${t}</span></li>`}).join('');
  return `<div class="tbar"><div class="pill brand"><span class="d"></span><span class="full">keep-the-customer</span><span class="md">.md</span></div>
   ${cur?`<ol class="steps" aria-label="Your journey">${steps}</ol>`:''}
   <div class="acts">${label?`<button class="pill ghost" data-act="back">&larr; ${label}</button>`:''}${cur?`<button class="pill pink" data-act="help">How to play</button>`:''}<a class="pill ghost" href="https://drpnvasist.com" target="_top">Home</a></div></div>`;
}
function nowText(m,preview){
  return `${preview?'If you confirm these choices. ':'Your shop right now. '}Visibility: ${METER.vis.st(m.vis).toLowerCase()}. Delivery: ${METER.rel.st(m.rel).toLowerCase()}. Loyalty: ${METER.loy.st(m.loy).toLowerCase()}.`;
}
function meters(m,d){
  return '<div class="meters" role="group" aria-label="Your shop. Hover or tap a meter to see what it means.">'+['vis','rel','loy','cash'].map(k=>{
    const M=METER[k],v=m[k],dl=d[k];
    return `<div class="meter" data-k="${k}" tabindex="0" aria-label="${M.n}: ${M.st(v)}. ${M.tip}"><b>${MI[k]}<span>${M.n}</span><span class="delta ${dl>0?'up':'down'}" aria-hidden="true">${dl?(dl>0?'&#9650;':'&#9660;'):''}</span><i class="info">i</i></b>
      <div class="track ${k==='cash'?'cash':''}"><i style="width:${v}%"></i></div><span class="status">${M.st(v)}</span><span class="tip" role="tooltip">${M.tip}</span></div>`;
  }).join('')+'</div><p class="sr" id="nowline" aria-live="polite">'+nowText(m,false)+'</p>';
}
function optCard(id,o,pressed,disabled,act,i){
  return `<button class="opt" data-act="${act}" data-id="${id}" aria-pressed="${pressed}" ${disabled?'disabled':''} style="--a:${TILT[i%TILT.length]}deg"><span class="window" style="--room:${ROOM[id]}">${ICON(id)}</span><span class="tick" aria-hidden="true">${pressed?'&#10003;':''}</span><span class="ttl">${o.n}</span><span class="dsc">${o.d}</span>
   <span class="tags"><span><b>Cost</b>${o.cost}</span><span><b>Reach</b>${o.reach}</span><span><b>Catch</b>${o.catch}</span></span><span class="nope">Not enough cash left for this one.</span></button>`;
}
function goRow(act,label){return `<div class="row"><button class="btn" id="go" data-act="${act}" data-label="${label}" disabled>${label}</button><p class="preview" id="preview">The arrows show what your choices would do. Nothing is final until you confirm.</p></div>`;}
function helpDlg(){
  const rows=['vis','rel','loy','cash'].map((k,i)=>`<div class="mcard" style="--a:${TILT[i]}deg"><span class="window" style="--room:${MROOM[k]}">${MI[k]}</span><b>${METER[k].n}</b><p>${METER[k].tip}</p></div>`).join('');
  return `<div class="overlay" id="help" data-act="closehelp"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="hh">
    <button class="pill ghost x" data-act="closehelp">close</button>
    <div class="dl"><p class="eyebrow">how to play</p><h2 id="hh">How to <em class="acc">play</em></h2>
    <p class="lead2">You run a small online grocery. Getting customers is easy. Keeping them is the game.</p>
    <ol class="dsteps">
      <li><span>The bar at the top shows the three situations and marks where you are.</span></li>
      <li><span>In each situation, choose <b>one or more</b> options. Each shows its <b>Cost</b>, <b>Reach</b> and <b>Catch</b>. Cash is limited, so every extra choice has a price.</span></li>
      <li><span>The arrows on the meters preview what your choices would do. Confirm when you are happy.</span></li>
      <li><span>A short story shows what happened and why.</span></li>
      <li><span>Use <b>Back</b> any time to change an earlier choice.</span></li>
    </ol></div>
    <div class="dr"><p class="eyebrow">the four meters</p><div class="mgrid">${rows}</div>
    <p class="note">Hover over a meter, or tap it on a phone, to see this again.</p>
    <button class="btn" data-act="closehelp">${S.screen==='s1'&&!S.sel1.length?'Got it, begin':'Close'}</button></div></div></div>`;

function view(){
  const sc=S.screen;
  if(sc==='intro') return {label:'',html:`<div class="fit stage intro-copy"><h1><span class="ln-mask"><span class="ln">Get found.</span></span><span class="ln-mask"><span class="ln" style="animation-delay:.08s">Keep <em class="acc">them</em><span class="acc">.</span></span></span></h1>
   <p class="lead">You run a small online grocery. Getting customers is the easy part. In three short situations you will decide how to get found, how to deliver, and how to make people stay.</p>
   <div class="how"><div style="--a:-1.6deg"><b>Choose one or more</b>Each option shows its cost, its reach and its catch. Cash is limited.</div><div style="--a:1.2deg"><b>See what happens</b>A short story shows the result and why.</div><div style="--a:-.8deg"><b>Go back any time</b>Change an earlier choice and explore another path.</div></div>
   <div class="row" style="margin-top:clamp(18px,4vh,36px)"><button class="btn" data-act="start">Start the story</button></div></div>`};
  if(sc==='s1'||sc==='s2'){
    const one=sc==='s1',T=one?S1:S2,sel=one?S.sel1:S.sel2,stg=one?1:2;
    return {label:'Back',html:`<div class="fit stage"><div class="split"><div class="col">${meters(S.m,S.d)}</div>

   <div class="row" style="margin-top:0"><button class="btn" data-act="again">Try a different path</button></div></div></div></div>`};

let wallKey=-1;
function setWall(){
  const k=stageNo(); if(k===wallKey) return; wallKey=k;
  $('#wall').innerHTML=WALLSET[k].map((id,i)=>`<figure class="frame" style="--room:${FROOM[id]}"><div class="pic">${ART[id]}</div><figcaption>${CAP[id]}</figcaption></figure>`).join('');
}

/* ---------- fit everything into one viewport ---------- */
function fit(){
  const m=$('.main'),f=$('.fit'); if(!m||!f) return;
  const minZ=innerWidth<760?.78:.68, avail=m.clientHeight;
  let z=1;
  const set=()=>{f.style.width=(100/z)+'%';f.style.transform=z<1?`scale(${z})`:'none';};
  const fits=()=>{set();return f.offsetHeight*z<=avail+1;};
  if(!fits()){
    /* largest scale in [minZ,1] whose laid-out height fits (wider layout = shorter, so test each) */
    let lo=minZ,hi=1;
    for(let i=0;i<9;i++){z=(lo+hi)/2;if(fits())lo=z;else hi=z;}
    z=lo;
  }
  set();
  m.style.overflowY=(f.offsetHeight*z>avail+2)?'auto':'hidden';
}
let fitRaf=0;const fitSoon=()=>{cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(fit);};
addEventListener('resize',fitSoon);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitSoon);

/* ---------- render (navigation only) and in-place patching (selection) ---------- */
function render(){
  const c=scene(),r=document.documentElement.style,v=view();
  r.setProperty('--bg',c[0]);r.setProperty('--fg',c[1]);r.setProperty('--floor',c[2]);
  document.documentElement.classList.toggle('intro',S.screen==='intro');
  document.documentElement.dataset.screen=S.screen;
  setWall();
  $('#app').innerHTML=bar(v.label)+`<div class="main">${v.html}</div>`;
  closeHelp();
  setStand(standIds());
  patchSel(true);
  fitSoon();
}
function patchMeters(m,d){
  document.querySelectorAll('.meter').forEach(el=>{
    const k=el.dataset.k,M=METER[k],v=m[k],dl=d[k];
    el.querySelector('.track i').style.width=v+'%';
    el.querySelector('.status').textContent=M.st(v);
    const de=el.querySelector('.delta');de.className='delta '+(dl>0?'up':'down');de.innerHTML=dl?(dl>0?'&#9650;':'&#9660;'):'';
    el.setAttribute('aria-label',`${M.n}: ${M.st(v)}. ${M.tip}`);
  });
  const nl=$('#nowline');if(nl)nl.textContent=nowText(m,Object.keys(d).length>0);
}
function patchSel(initial){
  const sc=S.screen,cfg={s1:[S.sel1,S1,1,eff1],s2:[S.sel2,S2,2,eff2],s3:[S.acts,S3,3,eff3]}[sc];
  if(!cfg){return;}
  const [sel,T,stg,ef]=cfg;
  document.querySelectorAll('.opts .opt').forEach(b=>{
    const id=b.dataset.id,on=sel.includes(id),dis=!on&&!affordable(stg,sel,id,T);
    b.setAttribute('aria-pressed',on);b.disabled=dis;b.querySelector('.tick').innerHTML=on?'&#10003;':'';
  });
  const pv=sel.length?applyEff(ef(sel),S.m):null;
  patchMeters(pv?pv.m:S.m,pv?pv.d:{});
  const go=$('#go');
  if(go){go.disabled=!sel.length;const base=go.dataset.label;
    go.textContent=sc==='s3'?(sel.length>1?'Launch these':'Launch this'):(sel.length>1?`Confirm ${sel.length} choices`:'Confirm choice');}
  const pr=$('#preview');if(pr)pr.classList.toggle('on',!!sel.length);
  if(!initial) setStand(sel);
}
function showHelp(){S.help=true;if(!$('#help'))document.body.insertAdjacentHTML('beforeend',helpDlg());const b=$('#help .btn');if(b)b.focus({preventScroll:true});}
function closeHelp(){S.help=false;const h=$('#help');if(h)h.remove();}
function toggle(arr,id){const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);}
function finish(){
  apply(eff3(S.acts));
  const loy=S.m.loy; S.final={k:loy>=60?'kept':(loy>=35?'part':'lost')};
  S.screen='end';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  if(b.classList.contains('overlay')&&e.target.closest('.dlg')) return;
  const a=b.dataset.act,id=b.dataset.id;
  /* in-place actions: no re-render, so nothing flickers or re-animates */
  if(a==='help'){showHelp();return}
  if(a==='closehelp'){closeHelp();return}
  if(a==='toggle1'){ if(S.sel1.includes(id)||affordable(1,S.sel1,id,S1)) toggle(S.sel1,id); patchSel();return}
  if(a==='toggle2'){ if(S.sel2.includes(id)||affordable(2,S.sel2,id,S2)) toggle(S.sel2,id); patchSel();return}
  if(a==='act'){ if(S.acts.includes(id)||affordable(3,S.acts,id,S3)) toggle(S.acts,id); patchSel();return}
  /* navigation */
  let help=false;
  if(a==='back'){back()}
  else if(a==='start'){push();S.screen='s1';S.d={};help=true}
  else if(a==='confirm1'){ if(S.sel1.length){push();apply(eff1(S.sel1));S.screen='s1r';} }
  else if(a==='to2'){push();S.screen='s2';S.d={}}
  else if(a==='confirm2'){ if(S.sel2.length){push();apply(eff2(S.sel2));S.screen='s2r';} }
  else if(a==='to3'){push();S.screen='s3';S.d={}}
  else if(a==='launch'){ if(S.acts.length){push();finish();} }
  else if(a==='again'){S=fresh()}
  render();
  if(help) showHelp();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#help')) closeHelp(); });
(function boot(){
  const start=d=>{ let h=false; if(d&&d.screen){ S=Object.assign(fresh(),d); h=!!d.help; } render(); if(h) showHelp(); };
  start({});
})();
</script>
