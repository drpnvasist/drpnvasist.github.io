name: Refresh calls and publish site

# Calls for papers are collected monthly on the owner's own PC (update-calls.ps1) and pushed here.
# Springer refuses requests from GitHub's servers, so this workflow does not read the web for calls.
# It republishes the site whenever something is pushed, or when you press "Run workflow".
on:
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["scraper/manual_cfps.csv", "site/**", "scraper/**.py"]

permissions:
  contents: write                # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      # Re-merges scraper/manual_cfps.csv into the saved list. Keeps the date of the last real collection.
      - name: Merge manual calls
        run: python scraper/scrape_cfps.py --manual-only

      # Journal homepages rarely change: cached, so this only looks up journals still missing one
      - name: Fill in journal homepages
        continue-on-error: true
        run: python scraper/build_homepages.py

      # Topics each journal publishes on (powers "Match my research"): also cached
      - name: Fill in journal topics
        continue-on-error: true
        run: python scraper/build_topics.py

      - name: Commit refreshed data
        run: |
          git config user.name "cfp-bot"
          git config user.email "cfp-bot@users.noreply.github.com"
          git add site/data/cfps.js site/data/cfps.json scraper/springer_ids.json site/data/homepages.js scraper/homepages.json site/data/topics.js scraper/topics.json
          git diff --staged --quiet || (git commit -m "Update data" && git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
