<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifacts · Dr. Pramukh N. Vasist</title>
<meta name="description" content="Interactive pages and session companions created by Dr. Pramukh Nanjundaswamy Vasist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Canopy design system tokens */
:root {
  --vanilla: #fdfbef; --pine: #2e3a26; --pine-deep: #1f261e; --cream: #f4f0db;
  --parchment: #fff4d6; --sand: #ccbf99; --bronze: #a68150; --sage: #60735c; --lime: #e7fd55;
  --serif: "PP Editorial Old", "Newsreader", Georgia, serif;
  --sans: "Work Sans", system-ui, sans-serif;
  --radius-lg: 1.25rem; --radius-xl: 1.75rem; --radius-pill: 9999px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; display: flex; flex-direction: column; background: var(--vanilla); color: var(--pine); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--pine); outline-offset: 3px; }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 2rem; }

.nav { position: sticky; top: 1rem; z-index: 10; margin: 1rem auto 0; width: min(1100px, calc(100% - 2rem));
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--pine); color: var(--parchment); border-radius: var(--radius-xl); padding: .65rem .75rem .65rem 1.5rem; }
.nav-name { font-family: var(--serif); font-weight: 300; font-size: 1.25rem; letter-spacing: .02em; text-decoration: none; white-space: nowrap; }
.nav-back { font-size: .875rem; letter-spacing: .02em; text-transform: uppercase; text-decoration: none; color: var(--parchment);
  border: 1px solid var(--sage); border-radius: var(--radius-pill); padding: .55rem 1.1rem; white-space: nowrap; transition: background .3s var(--ease), color .3s var(--ease); }
.nav-back:hover { background: var(--parchment); color: var(--pine); }
.nav-back:focus-visible { outline-color: var(--lime); }

header.wrap { padding-top: 5rem; padding-bottom: 3rem; }
main { flex: 1; }
.eyebrow { font-size: 1rem; letter-spacing: .02em; text-transform: uppercase; color: var(--sage); }
h1 { font-family: var(--serif); font-weight: 400; text-transform: uppercase; line-height: 1; font-size: clamp(2.75rem, 6.5vw, 5.375rem); color: var(--bronze); margin-top: 1rem; }
.intro { margin-top: 1.5rem; max-width: 46ch; color: var(--sage); }

.grid { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; padding-bottom: 8rem; }
.tile { height: 100%; display: flex; flex-direction: column; text-decoration: none; background: var(--cream);
  border-radius: var(--radius-lg); overflow: hidden; transition: background .3s var(--ease), color .3s var(--ease); }
.tile-media { display: block; background: var(--pine); padding: 1.25rem 1.5rem 1.75rem 2.5rem; overflow: hidden; }
.tile-fig { display: block; position: relative; }
.tile-fig img { display: block; width: 100%; height: auto; object-fit: cover; transition: transform .5s var(--ease); }
.tile-fig .main { aspect-ratio: 4 / 3.4; clip-path: url(#canopy1); }
.tile-fig .small { position: absolute; width: 42%; left: -12%; bottom: -8%; aspect-ratio: 1 / 1; clip-path: url(#canopy3); }
.tile-body { display: flex; flex-direction: column; flex: 1; padding: 1.25rem; }
.tile-date { font-size: .875rem; letter-spacing: .02em; text-transform: uppercase; color: var(--sage); }
.tile-title { font-family: var(--serif); font-weight: 300; font-size: 1.75rem; line-height: 1.15; letter-spacing: .01em; margin-top: .5rem; }
.tile-line { margin-top: .5rem; font-size: .95rem; color: var(--sage); }
.tile-go { margin-top: auto; padding-top: 1.25rem; display: inline-flex; align-items: center; gap: .5rem; font-size: .875rem; letter-spacing: .02em; text-transform: uppercase; }
.arr { display: inline-block; width: 1.5rem; height: 1px; background: currentColor; position: relative; transition: width .3s var(--ease); }
.arr::after { content: ""; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; border-top: 1px solid currentColor; border-right: 1px solid currentColor; transform: rotate(45deg); }
.tile:hover, .tile:focus-visible { background: var(--pine); color: var(--parchment); }
.tile:hover .tile-date, .tile:hover .tile-line, .tile:focus-visible .tile-date, .tile:focus-visible .tile-line { color: var(--sand); }
.tile:hover .tile-go, .tile:focus-visible .tile-go { color: var(--lime); }
.tile:hover .arr { width: 2.25rem; }
.tile:hover .tile-fig .main { transform: scale(1.02); }
@media (prefers-reduced-motion: reduce) { .tile-fig img, .arr { transition: none; } }

footer { margin-top: auto; background: var(--pine-deep); color: var(--sand); padding: 2rem 0; font-size: .875rem; }
footer .wrap { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

@media (max-width: 600px) {
  .wrap { padding: 0 1rem; }
  header.wrap { padding-top: 3.5rem; padding-bottom: 2rem; }
  .nav { padding-left: 1rem; }
  .nav-name { font-size: 1.05rem; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Canopy masks, same shapes as the Beyond the Prompt page -->
    <clipPath id="canopy1" clipPathUnits="objectBoundingBox"><path d="M0.12,0.005 L0.95,0.055 Q1,0.06 0.995,0.11 L0.945,0.95 Q0.94,1 0.89,0.995 L0.05,0.885 Q0,0.878 0.004,0.83 L0.07,0.05 Q0.075,0.002 0.12,0.005 Z"/></clipPath>
    <clipPath id="canopy3" clipPathUnits="objectBoundingBox"><path d="M0.03,0.17 L0.5,0.012 Q0.55,0 0.6,0.015 L0.965,0.11 Q1,0.12 0.997,0.16 L0.925,0.955 Q0.92,1 0.875,0.997 L0.115,0.94 Q0.075,0.935 0.072,0.895 L0.004,0.22 Q0,0.18 0.03,0.17 Z"/></clipPath>
  </defs>
</svg>

<nav class="nav" aria-label="Primary">
  <a class="nav-name" href="/">Dr. Pramukh N. Vasist</a>
  <a class="nav-back" href="/">Home</a>
</nav>

<header class="wrap">
  <p class="eyebrow">Interactive work</p>
  <h1>Artifacts</h1>
  <p class="intro">Interactive pages I have built for sessions, courses and research. Each opens as its own page.</p>
</header>

<main class="wrap">
  <ul class="grid">
    <!--
      To add an artifact: put its page in a folder at the site root
      (for example /my-new-page/index.html), save two photos in
      /artifacts/img/ (a main one about 720px wide and a square one about
      420px), then copy one <li>
      block below and change the link, image, date, title and line.
      Newest first.
    -->
    <li>
      <a class="tile" href="/beyond-the-prompt/">
        <span class="tile-media"><span class="tile-fig">
          <img class="main" src="img/btp-room.jpg" alt="" loading="lazy" width="720" height="480">
          <img class="small" src="img/btp-arch.jpg" alt="" loading="lazy" width="420" height="420">
        </span></span>
        <span class="tile-body">
          <span class="tile-date">Oct 2026</span>
          <span class="tile-title">Beyond the Prompt</span>
          <span class="tile-line">Ethics of AI for teaching and research.</span>
          <span class="tile-go">Open <span class="arr" aria-hidden="true"></span></span>
        </span>
      </a>
    </li>
  </ul>
</main>

<footer>
  <div class="wrap">
    <span>Dr. Pramukh Nanjundaswamy Vasist</span>
    <span>drpnvasist.com</span>
  </div>
</footer>

</body>
</html>
